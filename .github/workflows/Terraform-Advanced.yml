name: Terraform Advanced CI/CD

on:
  push:
    branches:
      - feature/trigger-lab
      - main
    
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  JOB_1-Trigger_Inspection:
    runs-on:
      group: my_runner_group

    steps:
      - name: STEP-1 -- Checkout Repo
        uses: actions/checkout@v4

      - name: STEP-2 -- Inspect GitHub Trigger
        run: |
          echo "================================"
          echo "GitHub Actions Trigger Details"
          echo "================================"

          echo "Event Name: ${{ github.event_name }}"
          echo "Git Ref: ${{ github.ref }}"
          echo "Ref Name: ${{ github.ref_name }}"
          echo "Head Ref: ${{ github.head_ref }}"
          echo "Base Ref : ${{ github.base_ref }}"
          echo "Commit SHA : ${{ github.sha }}"
          